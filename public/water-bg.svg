<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef8fc" />
      <stop offset="35%" stop-color="#e3f3fa" />
      <stop offset="70%" stop-color="#ebf7fc" />
      <stop offset="100%" stop-color="#dff0f9" />
    </linearGradient>
    <radialGradient id="sun1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#cbeaf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#dcf1fb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#eef8fc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#bee4f7" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#d9eef9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#eef8fc" stop-opacity="0" />
    </radialGradient>
    <filter id="caustics" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="3" result="noise" seed="42" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#sun1)" />
  <rect width="100%" height="100%" fill="url(#sun2)" />

  <!-- Flowing organic water waves -->
  <g opacity="0.35" filter="url(#caustics)">
    <path d="M-100,200 C300,50 800,350 1300,180 C1800,20 2100,250 2100,250 L2100,1200 L-100,1200 Z" fill="#b9e1f5" opacity="0.4"/>
    <path d="M-100,450 C400,300 900,550 1400,380 C1900,220 2100,500 2100,500 L2100,1200 L-100,1200 Z" fill="#9cd5f1" opacity="0.25"/>
    <path d="M-100,750 C350,600 850,850 1350,700 C1850,550 2100,800 2100,800 L2100,1200 L-100,1200 Z" fill="#7fc8ed" opacity="0.2"/>
  </g>

  <!-- Water ripple rings -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.45">
    <ellipse cx="450" cy="350" rx="280" ry="90" />
    <ellipse cx="450" cy="350" rx="190" ry="60" />
    <ellipse cx="450" cy="350" rx="90" ry="30" />
    
    <ellipse cx="1450" cy="650" rx="350" ry="110" />
    <ellipse cx="1450" cy="650" rx="240" ry="75" />
    <ellipse cx="1450" cy="650" rx="120" ry="40" />

    <ellipse cx="900" cy="950" rx="300" ry="95" />
    <ellipse cx="900" cy="950" rx="180" ry="55" />
  </g>

  <!-- Shimmering droplets & light motes -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="280" cy="180" r="4" />
    <circle cx="320" cy="220" r="2.5" />
    <circle cx="480" cy="140" r="3.5" />
    <circle cx="850" cy="280" r="4.5" />
    <circle cx="1150" cy="190" r="3" />
    <circle cx="1320" cy="320" r="5" />
    <circle cx="1600" cy="240" r="3.5" />
    <circle cx="1720" cy="400" r="4" />
    <circle cx="620" cy="580" r="3" />
    <circle cx="1080" cy="720" r="4" />
    <circle cx="1520" cy="850" r="3.5" />
  </g>
</svg>
